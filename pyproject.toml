[project]
name = "zephyr"
description = "An LLM inference engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
dynamic = ["version"]

[build-system]
requires = [
    "scikit-build-core>=1.0",
    "pybind11>=2.12",
]
build-backend = "scikit_build_core.build"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "VERSION"
regex = '''^(?P<value>[0-9]+(?:\.[0-9]+){2})$'''

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pybind11>=2.12",
    "pybind11-stubgen>=2.5",
    "ruff==0.15.20",
]


[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
sdist.include = ["VERSION"]
wheel.packages = ["python/zephyr"]

[project]
name = "zephyr"
description = "An LLM inference engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "transformers>=4.57,<5",
    "tokenizers>=0.22",
    "huggingface-hub>=0.34",
    "jinja2>=3.1.6",
]
dynamic = ["version"]

[project.optional-dependencies]
server = [
    "anyio>=4,<5",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
    "sse-starlette>=3,<4",
]

[project.scripts]
zephyr = "zephyr.cli:main"

[build-system]
requires = [
    "scikit-build-core>=1.0",
    "pybind11>=3.0",
]
build-backend = "scikit_build_core.build"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "VERSION"
regex = '''^(?P<value>[0-9]+(?:\.[0-9]+){2})$'''

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pybind11>=3.0",
    "pybind11-stubgen>=2.5",
    "ruff==0.15.20",
]


[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
sdist.include = ["VERSION"]
wheel.packages = ["python/zephyr"]
